name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          path: eatout

      # mealtime-nutrition is a path dependency until it reaches PyPI, so the
      # runner needs it beside this checkout. actions/checkout cannot write
      # outside the workspace, hence both repositories sit inside it.
      - uses: actions/checkout@v7
        with:
          repository: mealtime-tools/nutrition
          path: nutrition

      # Pinned exactly: setup-uv dropped its floating major tags after v7,
      # so v8 and later only exist as exact versions.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # The release gate runs the same matrix as CI. Pinning one older
      # interpreter here would let a version CI covers ship untested.
      - name: Run test suite
        run: uv run --python ${{ matrix.python-version }} pytest
        working-directory: eatout

  build-and-publish:
    name: Build & Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mealtime-eatout
    permissions:
      id-token: write  # Required for PyPI Trusted Publishing (OIDC)
      contents: write  # Required for GitHub Release creation

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Build distributions (sdist & wheel)
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
